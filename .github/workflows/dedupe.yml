name: HubSpot duplicate check

on:
  schedule:
    - cron: '0 13 * * *'        # 6:00 AM Arizona (UTC-7), every day
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of modified contacts to check (use 180 for the first run)'
        required: false
        default: '3'

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python dedupe.py
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_PORTAL_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
