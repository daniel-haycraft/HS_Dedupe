name: HubSpot duplicate check

on:
  schedule:
    - cron: '0 13 * * *'        # 6:00 AM Arizona (UTC-7), every day
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of modified contacts to check (use 180 for the first run)'
        required: false
        default: '3'
      force_full_pull:
        description: 'Ignore the cache and re-pull every contact (true/false)'
        required: false
        default: 'false'
      only_ids:
        description: 'Testing: comma-separated Record IDs to limit the run to (blank = all)'
        required: false
        default: ''
      max_merges:
        description: 'Testing: max merges this run (blank or 0 = no cap)'
        required: false
        default: ''

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Pull the contact cache saved by the previous run (if any).
      # restore-keys matches the most recent cache whose key starts with "contacts-cache-".
      - uses: actions/cache/restore@v4
        with:
          path: contacts_cache.json.gz
          key: contacts-cache-${{ github.run_id }}
          restore-keys: |
            contacts-cache-

      - run: python dedupe.py
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_PORTAL_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MERGE_ENABLED: ${{ vars.MERGE_ENABLED || 'false' }}
          FORCE_FULL_PULL: ${{ github.event.inputs.force_full_pull || 'false' }}
          ONLY_IDS: ${{ github.event.inputs.only_ids || '' }}
          MAX_MERGES: ${{ github.event.inputs.max_merges || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHARED_LINE_CAP: ${{ vars.SHARED_LINE_CAP || '5' }}
          CONFIDENCE_MIN: ${{ vars.CONFIDENCE_MIN || '0.85' }}

      # Save the updated cache for the next run. if: always() so a failed merge step
      # doesn't throw away a 15-minute pull.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: contacts_cache.json.gz
          key: contacts-cache-${{ github.run_id }}
